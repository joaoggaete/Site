# O Netlify precisa saber onde estão as funções. Sem este arquivo, a pasta
# netlify/functions sobe como conteúdo estático e a assistente não existe.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# A fita de fundo pesa 2 MB no desktop e 1,4 MB no celular. Sem cache longo,
# quem volta ao site baixa tudo de novo, e o público daqui é em boa parte
# celular com dado medido.
# O nome do arquivo é fixo, então "immutable" só é seguro porque QUALQUER
# troca de conteúdo vai junto com troca de nome. Se um dia eu regravar o
# fluxo-largo.mp4 mantendo o nome, quem já visitou continuará vendo o antigo
# por um ano — nesse caso o arquivo novo precisa de nome novo.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
